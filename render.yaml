services:
  - type: web
    name: tradewise-inspired
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tradewise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
databases:
  - name: tradewise-db
    plan: basic-256mb
